[project]
name = "mw-analysis"
requires-python = ">=3.14"
version = "0.1.0"
dependencies = [
    "h5py>=3.16.0",
    "jupyter>=1.1.1",
    "mne>=1.12.1",
    "mne-nirs>=0.7.3",
    "notebook>=7.6.1",
    "np>=1.0.2",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "scipy>=1.18.1",
    "snirf>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
